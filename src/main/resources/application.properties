spring.application.name=scheduler-api

# --- DATABASE CONFIGURATION ---
# Syntax: ${ENVIRONMENT_VARIABLE_NAME:DefaultFallbackValue}
# Logic: If running on Cloud, use the Env Var. If running locally, use the default.

# On Cloud: Render provides the full JDBC URL in 'DB_URL'.
# On Local: Defaults to localhost postgres.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/scheduler}

# On Cloud: Render provides the username in 'DB_USERNAME'.
# On Local: Defaults to 'samn'.
spring.datasource.username=${DB_USERNAME:samn}

# On Cloud: Render provides the password in 'DB_PASSWORD'.
# On Local: Defaults to '1738'.
spring.datasource.password=${DB_PASSWORD:1738}

# --- SERVER CONFIGURATION ---
# On Cloud: Render assigns a random port and puts it in 'PORT'.
# On Local: Defaults to standard port 8080.
server.port=${PORT:8080}

# --- HIBERNATE SETTINGS ---
# 'update': Automatically checks DB tables and updates columns to match Java entities.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
# Explicitly set the dialect to avoid warnings/errors with Postgres.
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
